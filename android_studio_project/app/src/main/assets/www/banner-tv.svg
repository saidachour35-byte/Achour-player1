<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#bannerBg)"/>
  
  <!-- Subtle background glow circles -->
  <circle cx="80" cy="90" r="60" fill="#6366f1" opacity="0.15"/>
  <circle cx="260" cy="40" r="80" fill="#ec4899" opacity="0.1"/>

  <!-- Left TV Icon -->
  <g transform="translate(24, 40)">
    <rect x="0" y="0" width="84" height="60" rx="10" fill="#090d16" stroke="url(#accent)" stroke-width="3"/>
    <polygon points="34,20 54,30 34,40" fill="#f59e0b"/>
    <path d="M28 60 L24 72 L60 72 L56 60" fill="#1e1b4b"/>
    <line x1="20" y1="72" x2="64" y2="72" stroke="url(#accent)" stroke-width="3"/>
  </g>

  <!-- Right Typography -->
  <text x="124" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="1">ACHOUR</text>
  <text x="124" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#38bdf8" letter-spacing="4">PLAYER</text>
  
  <rect x="124" y="116" width="60" height="4" rx="2" fill="url(#accent)"/>
  <text x="124" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">IPTV · LIVE · VOD · 4K</text>
</svg>
