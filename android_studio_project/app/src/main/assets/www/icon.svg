<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing TV border -->
  <rect x="56" y="76" width="400" height="280" rx="42" fill="none" stroke="url(#neonGrad)" stroke-width="12" filter="url(#glow)"/>
  <rect x="56" y="76" width="400" height="280" rx="42" fill="#090d16" stroke="url(#neonGrad)" stroke-width="6"/>

  <!-- TV Antennas subtle -->
  <path d="M190 76 L150 32" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>
  <path d="M322 76 L362 32" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
  <circle cx="150" cy="32" r="8" fill="#38bdf8"/>
  <circle cx="362" cy="32" r="8" fill="#ec4899"/>

  <!-- Stand -->
  <path d="M216 356 L200 410 L312 410 L296 356" fill="#1e1b4b" stroke="#6366f1" stroke-width="5" stroke-linejoin="round"/>
  <rect x="176" y="406" width="160" height="14" rx="7" fill="url(#neonGrad)"/>

  <!-- Play button inside TV -->
  <circle cx="256" cy="216" r="68" fill="url(#neonGrad)" opacity="0.25"/>
  <circle cx="256" cy="216" r="54" fill="#0f172a" stroke="url(#neonGrad)" stroke-width="4"/>
  <polygon points="242,188 286,216 242,244" fill="url(#playGrad)"/>

  <!-- Brand text -->
  <text x="256" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">ACHOUR PLAYER</text>
</svg>
