
name: Android APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build React App
        run: |
          npm install
          npm run build
          mkdir -p android_studio_project/app/src/main/assets/www
          cp -r dist/* android_studio_project/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build APK
        run: gradle -p android_studio_project assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: achour-player-release
          path: android_studio_project/app/build/outputs/apk/release/*.apk
